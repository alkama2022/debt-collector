<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover enables env(safe-area-inset-*) for notched phones.
         No maximum-scale/user-scalable: pinch-zoom stays available for a11y. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CollectNaija — Collect what you're owed. Stay in control.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <meta name="description" content="CollectNaija helps businesses track customers, invoices, outstanding balances and payments while automating payment reminders." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f4c81" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <!-- Standalone/immersive on iOS: app opens without browser chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CollectNaija" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function(){
        try{
          var t=localStorage.getItem('cn_theme');
          var d=t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
          if(d) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme=d?'dark':'light';
        }catch(e){}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
