version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: collectnaija
      POSTGRES_USER: collectnaija
      POSTGRES_PASSWORD: collectnaija
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collectnaija -d collectnaija"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: ./backend
    # No `command:` here on purpose — the Dockerfile CMD runs
    # `migrate && seed_billing && gunicorn`. Overriding it with a bare
    # gunicorn command skips migrations and leaves the plans table empty,
    # which makes every /billing/subscribe call 404.
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
  worker:
    build: ./backend
    command: celery -A config worker -l info -Q default,comms,ai,payments
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
  beat:
    build: ./backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
