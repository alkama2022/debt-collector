services:
  - type: web
    name: naijacollector
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    # migrate + seed_billing must run before gunicorn. seed_billing is
    # idempotent (get_or_create), so it is safe on every deploy. Without it
    # the plans table stays empty and every /billing/subscribe call 404s.
    startCommand: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py seed_billing
      && python manage.py ensure_admin
      && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "naijacollector.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://debt-collector-theta.vercel.app,https://debt-collector-ten.vercel.app"
      - key: FRONTEND_URL
        value: "https://debt-collector-ten.vercel.app"
      - key: TIME_ZONE
        value: "Africa/Lagos"
      - key: AI_PROVIDER
        value: "mock"
      - key: WHATSAPP_PROVIDER
        value: "mock"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      # Secrets — set manually in Render dashboard, do NOT commit values here
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
